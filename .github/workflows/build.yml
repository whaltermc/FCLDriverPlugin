name: Build driver plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest runner ships the Android SDK with licenses pre-accepted;
      # AGP auto-installs any missing platform/build-tools.

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy APK to output
        run: |
          mkdir -p output
          find app/build/outputs/apk -name '*.apk' -exec cp {} output/ \;
          ls -la output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCLDriverPlugin-PanVK
          path: output/*.apk

      - name: Upload APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true
