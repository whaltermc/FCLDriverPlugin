name: Build driver plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest runner ships the Android SDK with licenses pre-accepted;
      # AGP auto-installs any missing platform/build-tools.

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > plugin.keystore
            echo "Signing with keystore from repo secrets"
            echo "KEYSTORE_SOURCE=secret" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore plugin.keystore -storetype PKCS12 \
              -alias fclplugin -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass fclplugin \
              -dname "CN=FCL Driver Plugin, OU=FCL, O=whaltermc, C=US"
            echo "No KEYSTORE_BASE64 secret found; generated a bootstrap keystore"
            echo "KEYSTORE_SOURCE=generated" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$PWD/plugin.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-fclplugin}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS:-fclplugin}" >> "$GITHUB_ENV"

      - name: Upload bootstrap keystore (adopt as KEYSTORE_BASE64 secret for stable signatures)
        if: env.KEYSTORE_SOURCE == 'generated'
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: plugin.keystore
          if-no-files-found: ignore

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy APK to output
        run: |
          mkdir -p output
          find app/build/outputs/apk -name '*.apk' -exec cp {} output/ \;
          ls -la output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCLDriverPlugin-PanVK
          path: output/*.apk

      - name: Upload APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true
